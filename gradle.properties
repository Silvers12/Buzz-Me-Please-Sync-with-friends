org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# Élagage optimisé des ressources : R8 décide lui-même de ce qui part, plutôt que
# l'outil séparé. Le Play Console le réclame, et c'est le défaut à partir d'AGP 9 —
# l'assistant de migration l'avait remis à false, ce qui laissait ce commentaire sans
# sa ligne. Sans risque pour les libellés de sons, retrouvés par getIdentifier : ils
# sont protégés nommément par res/raw/keep.xml.
android.r8.optimizedResourceShrinking=true
android.builtInKotlin=false
android.newDsl=false
