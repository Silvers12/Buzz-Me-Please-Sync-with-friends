name: APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Uniquement des actions publiées par GitHub : les dépôts dont la politique
# n'autorise pas les actions tierces refusent le démarrage du workflow.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Le SDK Android est préinstallé sur les runners Ubuntu ; on complète
      # seulement ce qui pourrait manquer, avec le sdkmanager de l'image.
      - name: Composants du SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: APK de debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Installable directement : « buzz-me-please-debug » à télécharger sur la page du run.
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: buzz-me-please-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
